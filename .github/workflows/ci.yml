name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      # Token contrast (both themes) against WCAG AA; fails on any allowed pair below 4.5:1.
      - run: npm run contrast
      # Guarantee tests and axe over every component state.
      - run: npm test
      - run: npm run build
